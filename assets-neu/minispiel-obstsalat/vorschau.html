<title>Obstsalat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the game frame on top like in the app, the preview switches below it */
:root { --bg: #fbf3e6; --card: #fff8ec; --ink: #3a2414; --muted: #8a6e58; --accent: #e8650c; --line: #3a2414; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #211a15; --card: #352a21; --ink: #f4e6d4; --muted: #bba48e; --accent: #ff8a3a; --line: #120c08; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #211a15; --card: #352a21; --ink: #f4e6d4; --muted: #bba48e; --accent: #ff8a3a; --line: #120c08; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.game { box-shadow: 0 0 0 3px var(--line); }
.ctl { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row > span { width: 92px; color: var(--muted); font-size: 13px; font-weight: 600; }
.row button { all: unset; cursor: pointer; padding: 6px 10px; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-weight: 600; }
.row button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.row button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Obstsalat: same look as the other mini games (banner and × like .bee-pov .bp-ban / .bp-x) */
.os-root { --os-px: calc(100cqw / 180); container-type: inline-size; position: relative; aspect-ratio: 4 / 3; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: #bfe0f0; }
.os-cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
.os-ban { position: absolute; left: 50%; top: 3%; margin-top: 3px; transform: translateX(-50%); white-space: nowrap; z-index: 3; pointer-events: none;
  background: #fff8ec; color: #3a2414; box-shadow: 0 -3px 0 0 #3a2414, 0 3px 0 0 #3a2414, -3px 0 0 0 #3a2414, 3px 0 0 0 #3a2414, 0 6px 0 0 rgba(43, 29, 18, .18), inset 0 -2px 0 0 #ecdcc4;
  font-family: var(--f-body, system-ui), -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 0.86rem; font-weight: 600; line-height: 1.25; padding: 5px 12px 7px; transition: opacity .4s steps(4), transform .4s steps(4); }
.os-ban.pop { animation: os-ban .35s steps(4); }
.os-ban.away { opacity: 0; transform: translate(-50%, -30%); }
@keyframes os-ban { from { transform: translate(-50%, -40%); opacity: 0; } }
.os-x { position: absolute; right: 2%; top: 2%; width: 26px; height: 26px; border: 0; border-radius: 0; background: #fff8ec; color: #3a2414; box-shadow: inset 0 0 0 2px #3a2414; font: inherit; font-size: 1rem; line-height: 1; z-index: 4; cursor: pointer; }
.os-pops { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.os-pop { position: absolute; transform: translate(-50%, -50%); color: #fff8ec; font-family: var(--f-body, system-ui), sans-serif; font-weight: 800; font-size: 1.05rem;
  text-shadow: 2px 0 0 #3a2414, -2px 0 0 #3a2414, 0 2px 0 #3a2414, 0 -2px 0 #3a2414; animation: os-pop .9s steps(6) forwards; }
@keyframes os-pop { to { transform: translate(-50%, -160%); opacity: 0; } }
.os-end[hidden] { display: none; }
.os-end { position: absolute; left: 0; right: 0; top: 64%; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 3; pointer-events: none; }
.os-end-t { background: #fff8ec; color: #3a2414; box-shadow: 0 -3px 0 0 #3a2414, 0 3px 0 0 #3a2414, -3px 0 0 0 #3a2414, 3px 0 0 0 #3a2414, 0 6px 0 0 rgba(43, 29, 18, .18);
  font-family: var(--f-body, system-ui), sans-serif; font-size: 1.15rem; font-weight: 700; padding: 6px 16px 8px; animation: os-ban .35s steps(4); }
/* score and clock: two small plaques top left, like the banner; pixel icons at room-pixel size */
.os-hud { position: absolute; left: 2%; top: 2%; display: flex; gap: 10px; z-index: 3; pointer-events: none; }
.os-hud > b { display: flex; align-items: center; gap: 6px; background: #fff8ec; color: #3a2414; padding: 3px 9px 4px 6px; min-height: 26px; box-sizing: border-box;
  box-shadow: 0 -2px 0 0 #3a2414, 0 2px 0 0 #3a2414, -2px 0 0 0 #3a2414, 2px 0 0 0 #3a2414, 0 4px 0 0 rgba(43, 29, 18, .18), inset 0 -2px 0 0 #ecdcc4;
  font-family: var(--f-body, system-ui), -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.os-hud img { width: calc(var(--os-px) * 9); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.os-hud-t.hurry { background: #f8a060; box-shadow: 0 -2px 0 0 #3a2414, 0 2px 0 0 #3a2414, -2px 0 0 0 #3a2414, 2px 0 0 0 #3a2414, 0 4px 0 0 rgba(43, 29, 18, .18), inset 0 -2px 0 0 #e07a3a; }
.os-hud-t.tick { animation: os-tick .5s steps(3); }
@keyframes os-tick { 0% { transform: translateY(-3px); } 100% { transform: none; } }
.os-hud-s.minus { animation: os-minus .5s steps(4); }
@keyframes os-minus { 0%, 50% { background: #f08a7e; transform: translateX(-2px); } 25%, 75% { transform: translateX(2px); } }
.os-end-t { order: 1; }
.os-end-n { order: 2; color: #fff8ec; font-family: var(--f-body, system-ui), sans-serif; font-weight: 800; font-size: 2rem; line-height: 1;
  text-shadow: 3px 0 0 #3a2414, -3px 0 0 #3a2414, 0 3px 0 #3a2414, 0 -3px 0 #3a2414, 3px 3px 0 #3a2414; animation: os-ban .35s steps(4) .15s backwards; }
@media (prefers-reduced-motion: reduce) { .os-ban.pop, .os-pop, .os-end-t, .os-end-n, .os-hud-t.tick, .os-hud-s.minus { animation: none; } }
/* special effects: a thin time bar inside the banner, the ×2 sign under the score */
.os-ban-t { display: block; }
.os-ban-time { display: none; height: 3px; margin-top: 4px; background: #e8961a; transform-origin: left center; box-shadow: 0 0 0 1px #3a2414; }
.os-x2 { position: absolute; left: 3%; top: 17%; z-index: 3; pointer-events: none; color: #fff8ec; font-family: var(--f-body, system-ui), sans-serif; font-weight: 800; font-size: 1.1rem;
  text-shadow: 2px 0 0 #3a2414, -2px 0 0 #3a2414, 0 2px 0 #3a2414, 0 -2px 0 #3a2414, 2px 2px 0 #3a2414; animation: os-x2 .6s steps(2) infinite; }
.os-x2[hidden] { display: none; }
@keyframes os-x2 { 50% { transform: translateY(-2px); } }
/* combo: a badge that jumps up in steps, wobbles and floats away */
.os-combo { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none;
  font-family: var(--f-body, system-ui), sans-serif; animation: os-combo 1.3s steps(12) forwards; }
.os-combo b { background: #fff8ec; color: #3a2414; font-weight: 800; font-size: 1rem; padding: 3px 10px 4px; white-space: nowrap;
  box-shadow: 0 -3px 0 0 #3a2414, 0 3px 0 0 #3a2414, -3px 0 0 0 #3a2414, 3px 0 0 0 #3a2414, 0 6px 0 0 rgba(43, 29, 18, .2), inset 0 -3px 0 0 var(--cc, #f8a060); }
.os-combo i { font-style: normal; font-weight: 800; font-size: 1.35rem; color: var(--cc, #f8a060);
  text-shadow: 2px 0 0 #3a2414, -2px 0 0 #3a2414, 0 2px 0 #3a2414, 0 -2px 0 #3a2414, 2px 2px 0 #3a2414; }
.os-combo.c3 { --cc: #f8a060; } .os-combo.c4 { --cc: #f07a8a; } .os-combo.c5 { --cc: #b088e0; } .os-combo.c6 { --cc: #6ec0f0; }
@keyframes os-combo {
  0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
  12% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  24% { transform: translate(-50%, -50%) scale(.95) translateX(-3px); }
  36% { transform: translate(-50%, -50%) scale(1.05) translateX(2px); }
  48%, 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -130%) scale(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .os-combo, .os-x2 { animation: none; } }

</style>

    for (var k = 0; k < 14; k++) {
      var a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 55;
      S.drops.push({ x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 25, c: k % 3 ? f.flesh : skin, life: .5 + Math.random() * .4 });
    }
    return skin;
  }
  function segDist(px, py, ax, ay, bx, by) {
    var vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy, t = l2 ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / l2)) : 0;
    return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
  }
  function points(n) { return S.doubleT > 0 ? n * 2 : n; }
  function cutAlong(ax, ay, bx, by) {
    if (S.done) return;
    var len = Math.hypot(bx - ax, by - ay); if (len < 1.2) return;
    S.items.forEach(function (it) {
      if (it.cut || S.done) return;
      var f = FR[it.k];
      if (segDist(it.x, it.y, ax, ay, bx, by) > f.r + 1) return;
      it.cut = true;
      if (it.k === "kastanie") { boom(it); return; }
      var skin = sliceItem(it, bx - ax, by - ay);
      S.strokeHits++; S.cuts++; S.strokeCuts.push({ x: it.x, y: it.y, c: skin, f: f.flesh });
      addScore(points(it.k === "goldapfel" ? 4 : 1));
      if (it.k === "goldapfel") { cheer(1); popText(S.doubleT > 0 ? "+8" : "+4", it.x, it.y, "#f8d850"); }
      if (SPECIALS[it.k]) special(it.k);
    });
  }
  function special(k) {
    var sp = SPECIALS[k];
    if (k === "frostbeere") S.slowT = sp.t;
    if (k === "sonnenblume") { S.doubleT = sp.t; x2El.hidden = false; }
    if (k === "honigwabe") { S.rainT = sp.t; S.rainSpawn = 0; }
    S.specialMax = sp.t; S.specialKey = k;
    showBanner(sp.ban, sp.t, true);
    cheer(1);
  }
  function boom(it) {                                   // the chestnut husk: white flash, spines fly, minus 10 points
    S.flash = .45; S.shake = .45; S.face = "schreck"; S.faceT = 1.4; S.hop = 0; S.hops = 0;
    addScore(-10); S.scoreHit = .6; popText("−10", it.x, it.y, "#f08a7e");
    for (var k = 0; k < 40; k++) {
      var a = k / 40 * Math.PI * 2, sp = 50 + Math.random() * 70;
      S.bits.push({ x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, c: k % 3 ? "#6a9a38" : "#d8f0a0", life: .7 + Math.random() * .4 });
    }
    S.items.forEach(function (o) { if (!o.cut) { var dx = o.x - it.x, dy = o.y - it.y, d = Math.hypot(dx, dy) || 1; o.vx += dx / d * 60; o.vy = Math.max(o.vy, 0) + 20; } });
  }
  function cheer(n) { S.face = "froh"; S.faceT = .6 + n * .35; S.hop = .18; S.hops = n; }

  // ---------- combo: badge, confetti, rays, a double hop
  function combo(n, x, y) {
    var bonus = points(n - 1);
    addScore(bonus); cheer(2);
    var e = document.createElement("div"); e.className = "os-combo c" + Math.min(6, n);
    e.innerHTML = '<b></b><i></i>';
    e.querySelector("b").textContent = n + "er-Kombi"; e.querySelector("i").textContent = "+" + bonus;
    e.style.left = Math.max(22, Math.min(78, x / W * 100)) + "%"; e.style.top = Math.max(22, Math.min(70, y / H * 100)) + "%";
    pops.appendChild(e); setTimeout(function () { e.remove(); }, 1300);
    S.strokeCuts.forEach(function (c) {
      for (var k = 0; k < 10; k++) {
        var a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 60;
        S.bits.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, c: k % 2 ? c.c : c.f, life: .8 + Math.random() * .5, big: k % 4 === 0 });
      }
    });
    for (var r = 0; r < 10; r++) S.rays.push({ x: x, y: y, a: r / 10 * Math.PI * 2 + Math.random() * .2, t: 0 });
    if (n >= 5) S.flash = Math.max(S.flash, .18);
  }

  // ---------- input
  var HB = { x: 128, y: 91, w: 48, h: 46 };
  function pt(ev) { var r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
  var down = null;
  cv.addEventListener("pointerdown", function (ev) {
    if (S.done) { if (S.endT > 1.4) reset(); return; }
    var p = pt(ev); down = { x: p.x, y: p.y, moved: 0 }; S.stroke = p; S.strokeHits = 0; S.strokeCuts = [];
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    S.trail.push({ x: p.x, y: p.y, t: S.t });
  });
  cv.addEventListener("pointermove", function (ev) {
    if (!down || !S.stroke) return;
    var p = pt(ev), q = S.stroke;
    down.moved += Math.hypot(p.x - q.x, p.y - q.y);
    cutAlong(q.x, q.y, p.x, p.y);
    S.stroke = p; S.trail.push({ x: p.x, y: p.y, t: S.t });
  });
  function up(ev) {
    if (!down) return;
    var p = pt(ev);
    if (down.moved < 3 && p.x >= HB.x && p.x < HB.x + HB.w && p.y >= HB.y + 4 && p.y < HB.y + HB.h) finish();
    if (S.strokeHits >= 3 && !S.done) {
      var lc = S.strokeCuts[S.strokeCuts.length - 1];
      combo(S.strokeHits, lc.x, lc.y);
    }
    down = null; S.stroke = null; S.strokeHits = 0; S.strokeCuts = [];
  }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  root.querySelector(".os-x").addEventListener("click", function () { if (opts.onClose) opts.onClose(); else reset(); });

  function popText(t, x, y, col) {
    var e = document.createElement("b"); e.className = "os-pop"; e.textContent = t; if (col) e.style.color = col;
    e.style.left = (x / W * 100) + "%"; e.style.top = (y / H * 100) + "%";
    pops.appendChild(e); setTimeout(function () { e.remove(); }, 900);
  }
  function finish(title) {
    if (S.done) return;
    S.done = true; S.endT = 0; S.endTitle = title || "";
    S.slowT = 0; S.rainT = 0; S.doubleT = 0; x2El.hidden = true; S.queue = [];
    S.record = S.score > 0 && S.score > S.best; if (S.record) saveBest(S.score);
    hudT.classList.remove("hurry", "tick");
  }
  function drawHud() {                                  // score and clock in the app font (DOM), changed only when the numbers change
    var t = Math.max(0, Math.ceil(S.timeLeft));
    if (S.score !== hudShown.s) {
      scoreEl.textContent = S.score;
      if (hudShown.s >= 0 && S.score < hudShown.s) { hudS.classList.remove("minus"); void hudS.offsetWidth; hudS.classList.add("minus"); }
      hudShown.s = S.score;
    }
    if (t !== hudShown.t) {
      timeEl.textContent = Math.floor(t / 60) + ":" + (t % 60 < 10 ? "0" : "") + (t % 60);
      if (!S.done && t <= HURRY && t > 0) { hudT.classList.add("hurry"); hudT.classList.remove("tick"); void hudT.offsetWidth; hudT.classList.add("tick"); }
      hudShown.t = t;
    }
  }

  // ---------- drawing helpers (whole room pixels)
  function px(x, y, c) { cx.fillStyle = c; cx.fillRect(Math.round(x), Math.round(y), 1, 1); }
  function line(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    cx.fillStyle = c;
    for (var n = 0; n < 400; n++) { cx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; var e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  function sprite(im, x, y) { cx.drawImage(im, Math.round(x), Math.round(y)); }

  function drawEnvBack(tm) {
    if (tm === "nacht") STARS.forEach(function (s) { if (Math.sin(S.t * 2 + s[2]) > -.4) px(s[0], s[1], "#fff8d8"); });
    if (env.weather === "wolken" || env.weather === "regen") CLOUDS.forEach(function (c, i) {
      var x = ((c.x + S.t * (3 + i)) % 230) - 40;
      cx.fillStyle = env.weather === "regen" ? "#c8ccd4" : "#f4f6f8";
      for (var y = 0; y < 5; y++) { var half = Math.round(c.w / 2 * Math.sqrt(1 - Math.pow((y - 2) / 2.8, 2))); cx.fillRect(Math.round(x + c.w / 2 - half), c.y - 10 + y, half * 2, 1); }
    });
  }
  function drawTint(tm) {
    var cols = [];
    if (tm === "abend") cols.push("#ffd2a8"); else if (tm === "nacht") cols.push("#6070a8");
    if (env.weather === "regen") cols.push("#d4d8e0"); else if (env.weather === "wolken") cols.push("#eef0f2");
    if (S.slowT > 0) cols.push("#d8ecff");
    cx.globalCompositeOperation = "multiply";
    cols.forEach(function (c) { cx.fillStyle = c; cx.fillRect(0, 0, W, H); });
    cx.globalCompositeOperation = "source-over";
  }
  function drawEnvFront(tm, dt) {
    if (tm === "nacht" && env.season !== "winter") FLIES.forEach(function (f) {
      var x = f.x + Math.sin(S.t * .7 + f.p) * 8, y = f.y + Math.sin(S.t * 1.3 + f.p * 2) * 4;
      if (Math.sin(S.t * 3 + f.p) > 0) px(x, y, "#e8f890");
    });
    if (env.weather === "regen") WX.forEach(function (d) {
      d.y += 150 * d.s * dt; d.x -= 30 * d.s * dt; if (d.y > H) { d.y = -4; d.x = Math.random() * 200; }
      px(d.x, d.y, "#a8c4e0"); px(d.x - .2, d.y + 1, "#a8c4e0");
    });
    if (env.weather === "schnee") WX.forEach(function (d) {
      d.y += 18 * d.s * dt; d.x += Math.sin(S.t + d.s * 9) * 6 * dt; if (d.y > H) { d.y = -2; d.x = Math.random() * 180; }
      px(d.x, d.y, "#ffffff");
    });
  }
  function drawFrost() {                                // slow motion: frost creeps in from the edges, icicles on top
    var k = Math.min(1, S.slowT / .4, (5 - S.slowT) / .3 + .2);
    var depth = Math.round(4 * k);
    for (var x = 0; x < W; x++) {
      var d = depth + (hash(x, 1) % 3);
      for (var y = 0; y < d; y++) px(x, y, y === d - 1 ? "#bfe0f6" : "#f2faff");
      var ic = hash(x, 7) % 9 === 0 ? 3 + hash(x, 3) % 4 : 0;
      for (y = 0; y < ic * k; y++) px(x, d + y, "#dff0fa");

      for (y = 0; y < b; y++) px(x, H - 1 - y, "#f2faff");
    }
    for (var yy = 0; yy < H; yy++) {
      var dd = depth - 1 + (hash(2, yy) % 3);
      for (x = 0; x < dd; x++) { px(x, yy, "#f2faff"); px(W - 1 - x, yy, "#f2faff"); }
    }
  }

  // ---------- main loop
  var last = performance.now(), raf = 0;
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now; S.t += dt;
    var ts = S.slowT > 0 ? .38 : 1, wdt = dt * ts; S.wt += wdt;
    var tm = timeNow();
    if (!S.done) {
      S.spawnT -= dt;
      if (S.spawnT <= 0 && S.rainT <= 0) { volley(); S.spawnT = Math.max(.75, 1.7 - S.t / 45) + Math.random() * .35; }
      if (S.rainT > 0) {                                // fruit rain from both sides
        S.rainSpawn -= dt;
        if (S.rainSpawn <= 0) {
          S.rainSpawn = .11;
          var left = Math.random() < .5, k = fruitKey(), f = FR[k];
          S.items.push({ k: k, x: left ? -f.w : W + f.w, y: 50 + Math.random() * 60, vx: (left ? 1 : -1) * (85 + Math.random() * 40), vy: -(70 + Math.random() * 50), cut: false, born: S.wt });
        }
      }
      S.queue = S.queue.filter(function (q) { if (S.wt >= q.at) { launch(q.k, q.x, q.peak, q.drift); return false; } return true; });
      S.timeLeft -= wdt;                                // slow motion slows the clock too
      if (S.timeLeft <= 0) { S.timeLeft = 0; finish(); }
    } else S.endT += dt;
    if (S.slowT > 0) S.slowT -= dt;
    if (S.doubleT > 0) { S.doubleT -= dt; if (S.doubleT <= 0) x2El.hidden = true; }
    if (S.rainT > 0) S.rainT -= dt;
    if (S.specialMax && (S.slowT > 0 || S.doubleT > 0 || S.rainT > 0)) banTime.style.transform = "scaleX(" + Math.max(0, Math.max(S.slowT, S.doubleT, S.rainT) / S.specialMax).toFixed(3) + ")";

    S.items.forEach(function (it) { it.vy += G * wdt; it.x += it.vx * wdt; it.y += it.vy * wdt; });
    S.items = S.items.filter(function (it) { return !it.cut && it.y < H + 30 && it.x > -40 && it.x < W + 40; });
    S.halves.forEach(function (h) { h.vy += G * wdt; h.x += h.vx * wdt; h.y += h.vy * wdt; });
    S.halves = S.halves.filter(function (h) { return h.y < H + 30; });
    [S.drops, S.bits].forEach(function (arr) { arr.forEach(function (d) { d.vy += G * wdt * .8; d.x += d.vx * wdt; d.y += d.vy * wdt; d.life -= dt; }); });
    S.drops = S.drops.filter(function (d) { return d.life > 0; }); S.bits = S.bits.filter(function (d) { return d.life > 0; });
    S.rays.forEach(function (r) { r.t += dt; }); S.rays = S.rays.filter(function (r) { return r.t < .3; });
    S.trail = S.trail.filter(function (p) { return S.t - p.t < .14; });
    S.shown += (S.score - S.shown) * Math.min(1, dt * 8);
    S.faceT -= dt; S.shake -= dt; S.blinkT -= dt; S.flash -= dt;
    S.hop -= dt; if (S.hop <= 0 && S.hops > 1) { S.hops--; S.hop = .18; }
    if (S.faceT <= 0) S.face = "normal";
    if (S.blinkT < -.12) S.blinkT = 2.5 + Math.random() * 3;

    var ox = S.shake > 0 ? (Math.floor(S.t * 40) % 2 ? 1 : -1) : 0;
    cx.setTransform(1, 0, 0, 1, ox, 0);
    var bg = BG[env.season]; if (bg.complete) cx.drawImage(bg, 0, 0);
    drawEnvBack(tm);
    var hop = S.hop > 0 ? -3 : 0, face = S.face === "normal" && S.blinkT < 0 ? "blinzeln" : S.face;
    if (HAM[face].complete) sprite(HAM[face], HB.x, HB.y + hop);
    cx.fillStyle = "rgba(43,29,18,.16)"; cx.fillRect(104, 131, 40, 2);
    var lv = S.shown < FULL * .08 ? 0 : S.shown < FULL * .4 ? 1 : S.shown < FULL * .75 ? 2 : 3, b = BOWL[lv];
    if (b.im.complete) sprite(b.im, 107, 133 - b.h);
    S.items.forEach(function (it) {
      var f = FR[it.k]; if (!f.im.complete) return;
      var jx = it.k === "kastanie" ? (Math.floor(S.t * 20 + it.born * 7) % 3) - 1 : 0;        // the husk trembles a little
      var x0 = it.x - f.w / 2 + jx, y0 = it.y - f.h / 2;
      if (SPECIALS[it.k] && f.sil) {                    // specials glow along their outline, blinking
        var gc = it.k === "frostbeere" ? "#bfe8ff" : it.k === "sonnenblume" ? "#ffd8a0" : "#ffffff";
        if (Math.floor(S.t * 5) % 2) gc = "#ffffff";
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) { sprite(f.sil[gc], x0 + o[0], y0 + o[1]); });
      }
      sprite(f.im, x0, y0);
    });
    S.halves.forEach(function (h) { sprite(h.c, h.x - h.w / 2, h.y - h.h / 2); });
    S.drops.forEach(function (d) { px(d.x, d.y, d.c); });
    S.bits.forEach(function (d) { px(d.x, d.y, d.c); if (d.big) { px(d.x + 1, d.y, d.c); px(d.x, d.y + 1, d.c); } });
    S.rays.forEach(function (r) {                        // combo: short bright rays shooting outward
      var a = 6 + r.t * 90, bb = a + 6;
      cx.globalAlpha = Math.max(0, 1 - r.t / .3);
      line(r.x + Math.cos(r.a) * a, r.y + Math.sin(r.a) * a, r.x + Math.cos(r.a) * bb, r.y + Math.sin(r.a) * bb, "#fff8ec");
      cx.globalAlpha = 1;
    });
    for (i = 1; i < S.trail.length; i++) {
      var a = S.trail[i - 1], q = S.trail[i], age = S.t - q.t;
      cx.globalAlpha = Math.max(0, 1 - age / .14);
      line(a.x, a.y, q.x, q.y, S.slowT > 0 ? "#e8f6ff" : "#fff8ec");
      cx.globalAlpha = 1;
    }
    drawTint(tm);
    if (S.slowT > 0) drawFrost();
    drawEnvFront(tm, dt);
    cx.setTransform(1, 0, 0, 1, 0, 0);
    if (S.flash > 0) { cx.fillStyle = "rgba(255,252,244," + Math.min(1, S.flash / .35).toFixed(2) + ")"; cx.fillRect(0, 0, W, H); }
    if (S.done && S.endT > .7) {
      var k2 = Math.min(1, (S.endT - .7) / .3);
      cx.fillStyle = "rgba(43,29,18," + (.45 * k2).toFixed(2) + ")"; cx.fillRect(0, 0, W, H);
      if (BIG.im.complete) {                            // the big bowl is only as full as what was cut: the heap is cut off from the top
        var heap = 20, frac = Math.min(1, S.score / FULL), sy = Math.round((1 - frac) * heap);
        var bx = Math.round((W - BIG.w) / 2), by = Math.round(58 - BIG.h / 2 + (1 - k2) * 10);
        cx.drawImage(BIG.im, 0, sy, BIG.w, BIG.h - sy, bx, by + sy, BIG.w, BIG.h - sy);
      }
      if (endEl.hidden) {
        endT.textContent = S.record ? "Neuer Rekord!" : S.score >= FULL ? "Obstsalat!" : S.score >= FULL / 2 ? "Kleiner Obstsalat" : "Ein paar Stückchen";
        endN.textContent = S.score;
        endEl.hidden = false;
      }
    }
    drawHud();
    raf = requestAnimationFrame(frame);
  }
  reset();
  raf = requestAnimationFrame(frame);

  return {
    state: function () { return S; },
    setEnv: function (e) { Object.keys(e).forEach(function (k) { env[k] = e[k]; }); },
    restart: reset,
    destroy: function () { cancelAnimationFrame(raf); root.innerHTML = ""; }
  };
}

(function () {
  var m = new Date().getMonth(), season = m < 2 || m === 11 ? "winter" : m < 5 ? "fruehling" : m < 8 ? "sommer" : "herbst";
  var env = { season: season, time: "auto", weather: "sonne" };
  var game = mountObstsalat(document.getElementById("game"), ART, env); window.__os = game;
  function mark() { document.querySelectorAll(".row").forEach(function (r) { r.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", env[r.dataset.k] === b.dataset.v ? "true" : "false"); }); }); }
  document.querySelectorAll(".row button").forEach(function (b) {
    b.addEventListener("click", function () { var k = b.parentElement.dataset.k; env[k] = b.dataset.v; game.setEnv(env); mark(); });
  });
  mark();
})();
</script>
